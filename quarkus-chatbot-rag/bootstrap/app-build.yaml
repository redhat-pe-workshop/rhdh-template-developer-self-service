apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ${{ values.name }}-build
  namespace: ${{ values.gitops_namespace }}
  labels:
    rhdh.redhat.com/app-name: ${{ values.name }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: ${{ values.name }}-build
    server: https://kubernetes.default.svc
  project: ${{ values.argocd_project }}
  source:
    path: build
    repoURL: https://${{ values.gitlab_host }}/${{ values.owner }}/${{ values.name }}-gitops.git
    targetRevision: main
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - RespectIgnoreDifferences=true
