apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.app.name }}-litellm
  namespace: {{ .Values.app.namespace.name }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-secret-store
    kind: ClusterSecretStore
  target:
    name: {{ .Values.app.name }}-litellm
    creationPolicy: Owner
  data:
    - secretKey: QUARKUS_LANGCHAIN4J_OPENAI_API_KEY
      remoteRef:
        key: secrets/litellm/credentials
        property: api_key
    - secretKey: QUARKUS_LANGCHAIN4J_OPENAI_BASE_URL
      remoteRef:
        key: secrets/litellm/credentials
        property: base_url
