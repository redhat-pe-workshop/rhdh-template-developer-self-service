apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: quarkus-chatbot-rag
  title: Quarkus AI Chatbot with RAG
  description: Create a web-based AI chatbot with Retrieval-Augmented Generation (RAG), prompt injection guardrails, secured CI/CD pipeline, and GitOps deployment
  annotations:
    backstage.io/techdocs-ref: dir:.
  tags:
    - quarkus
    - ai
    - langchain4j
    - golden-path
spec:
  owner: rhdh
  type: service

  parameters:
    - title: Application Details
      required:
        - name
        - owner
        - developerGroup
      properties:
        name:
          title: Application Name
          type: string
          description: Unique name for this application (lowercase, hyphens allowed)
          pattern: "^[a-z][a-z0-9-]*$"
        owner:
          title: Owner
          type: string
          description: Group that owns this application
          ui:field: EntityPicker
          ui:options:
            catalogFilter:
              kind: Group
        developerGroup:
          title: Developer Group
          type: string
          description: Group granted edit access to the build, dev, and prod namespaces
          ui:field: EntityPicker
          ui:options:
            catalogFilter:
              kind: Group
        description:
          title: Description
          type: string
          description: Short description displayed in the Backstage catalog
          default: A Quarkus AI chatbot with RAG capabilities

    - title: Image Registry
      required:
        - imageOrganization
      properties:
        imageOrganization:
          title: Image Organization
          type: string
          description: Quay organization (e.g. parasol, myorg)
          default: parasol

  # Jinja variables (gitlab-gitlab.apps.cluster-8qph6.dyn.redhatworkshops.io, quay.apps.cluster-8qph6.dyn.redhatworkshops.io, etc.) are replaced with
  # cluster-specific values when the Ansible import job pushes templates to GitLab
  # during cluster setup. They are NOT Backstage scaffolder expressions.
  steps:
    - id: fetch-source
      name: Fetch Source Skeleton
      action: fetch:template
      input:
        url: ./skeleton/
        targetPath: source
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          gitlab_group: parasol
          gitlab_host: gitlab-gitlab.apps.cluster-8qph6.dyn.redhatworkshops.io
          cluster_subdomain: apps.cluster-8qph6.dyn.redhatworkshops.io

    - id: publish-source
      name: Publish Source to GitLab
      action: publish:gitlab
      input:
        repoUrl: gitlab-gitlab.apps.cluster-8qph6.dyn.redhatworkshops.io?owner=parasol&repo=${{ parameters.name }}
        sourcePath: source
        defaultBranch: main
        repoVisibility: public

    - id: fetch-manifests
      name: Fetch GitOps Manifests
      action: fetch:template
      input:
        url: ./manifests/
        targetPath: manifests
        values:
          name: ${{ parameters.name }}
          owner: parasol
          source_repo: ${{ steps['publish-source'].output.remoteUrl }}.git
          image_host: quay.apps.cluster-8qph6.dyn.redhatworkshops.io
          image_organization: ${{ parameters.imageOrganization }}
          image_name: ${{ parameters.name }}
          image_tag: latest
          gitlab_host: gitlab-gitlab.apps.cluster-8qph6.dyn.redhatworkshops.io
          cluster_subdomain: apps.cluster-8qph6.dyn.redhatworkshops.io
          gitops_namespace: openshift-gitops
          argocd_project: developer-apps
          chart_repo_url: https://redhat-pe-workshop.github.io/ocp-app-platform-demo-apps-helm

    - id: publish-manifests
      name: Publish Manifests to GitLab
      action: publish:gitlab
      input:
        repoUrl: gitlab-gitlab.apps.cluster-8qph6.dyn.redhatworkshops.io?owner=parasol&repo=${{ parameters.name }}-gitops
        sourcePath: manifests
        defaultBranch: main
        repoVisibility: public

    - id: fetch-bootstrap
      name: Render Bootstrap Resources
      action: fetch:template
      input:
        url: ./bootstrap/
        targetPath: bootstrap
        values:
          name: ${{ parameters.name }}
          owner: parasol
          developer_group: ${{ parameters.developerGroup }}
          gitlab_host: gitlab-gitlab.apps.cluster-8qph6.dyn.redhatworkshops.io
          gitops_namespace: openshift-gitops
          argocd_project: developer-apps

    - id: push-bootstrap
      name: Push Bootstrap to Infrastructure Repo
      action: gitlab:repo:push
      input:
        repoUrl: gitlab-gitlab.apps.cluster-8qph6.dyn.redhatworkshops.io?repo=infra-app-of-apps&owner=rhdh
        branchName: main
        commitMessage: "feat: bootstrap ${{ parameters.name }} (build, dev, prod)"
        targetPath: app-bootstraps/${{ parameters.name }}
        sourcePath: bootstrap

    - id: register
      name: Register Component
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish-source'].output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

  output:
    links:
      - title: Source Repository
        url: ${{ steps['publish-source'].output.remoteUrl }}
      - title: GitOps Repository
        url: ${{ steps['publish-manifests'].output.remoteUrl }}
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
    text:
      - title: Next Steps
        content: |
          Argo CD Applications might take a moment to settle and deploy the initial environment.

          Your application has three environments:
          - **Build** (${{ parameters.name }}-build) — secured CI/CD pipeline
          - **Dev** (${{ parameters.name }}-dev) — development deployment
          - **Prod** (${{ parameters.name }}-prod) — production deployment

          Push code to the source repository to trigger the build pipeline.
